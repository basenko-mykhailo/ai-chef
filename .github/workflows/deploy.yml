name: Deploy to production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/ai_chef

            git fetch --all
            git reset --hard origin/main

            env UID=$(id -u) GID=$(id -g) docker compose up -d --build

            docker compose exec -T php composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # Build front-end assets (Vite manifest) — the php image has no Node,
            # so use a throwaway Node container against the bind-mounted src/.
            docker run --rm -v "$(pwd)/src:/app" -w /app node:22-alpine \
              sh -c 'npm ci && npm run build'

            docker compose exec -T php php artisan migrate --force
            docker compose exec -T php php artisan config:cache
            docker compose exec -T php php artisan route:cache
            docker compose exec -T php php artisan view:cache

            echo "Deploy done at $(date)"